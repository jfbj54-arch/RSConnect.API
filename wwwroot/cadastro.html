<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RSConnect - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark">

<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <h1 class="logo-text">RSConnect</h1>
    </div>

    <h2 class="title">Crie sua conta</h2>

    <input type="text" id="nome" placeholder="Nome completo">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">

    <button class="btn-primary" onclick="cadastrar()">Cadastrar</button>

    <p class="link">
        Já tem conta? <a href="index.html">Entrar</a>
    </p>

    <p id="erro" class="erro"></p>
</div>

<script src="js/api.js"></script>
<script>
async function cadastrar() {
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if (!nome || !email || !senha) {
        document.getElementById("erro").innerText = "Preencha todos os campos";
        return;
    }

    try {
        const result = await apiPost("usuarios", { nome, email, senha });

        if (result.id) {
            alert("Cadastro realizado com sucesso!");
            window.location.href = "index.html";
        } else {
            document.getElementById("erro").innerText = "Erro ao cadastrar";
        }
    } catch {
        document.getElementById("erro").innerText = "Erro ao conectar ao servidor";
    }
}
</script>

</body>
</html>
