<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Prestador</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        .container { max-width: 400px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 8px; }
        input, select { width: 100%; margin-bottom: 10px; padding: 8px; }
        button { width: 100%; padding: 10px; background: #007bff; color: #fff; border: none; cursor: pointer; }
        .msg { margin-top: 10px; text-align: center; }
        a { display: block; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h2>Cadastrar Prestador</h2>

    <label>Nome</label>
    <input type="text" id="nome">

    <label>Email</label>
    <input type="email" id="email">

    <label>Senha</label>
    <input type="password" id="senha">

    <label>Telefone</label>
    <input type="text" id="telefone">

    <label>Categoria</label>
    <select id="categoria">
        <option value="Eletricista">Eletricista</option>
        <option value="Encanador">Encanador</option>
        <option value="Pintor">Pintor</option>
        <option value="Informática">Informática</option>
        <option value="Diarista">Diarista</option>
    </select>

    <label>Endereço</label>
    <input type="text" id="endereco">

    <button onclick="cadastrar()">Cadastrar</button>

    <a href="login-prestador.html">Já tenho conta</a>

    <div id="mensagem" class="msg"></div>
</div>

<script>
    async function cadastrar() {
        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const telefone = document.getElementById('telefone').value;
        const categoria = document.getElementById('categoria').value;
        const endereco = document.getElementById('endereco').value;

        const msg = document.getElementById('mensagem');

        if (!nome || !email || !senha || !telefone || !categoria || !endereco) {
            msg.innerText = 'Preencha todos os campos.';
            msg.style.color = 'red';
            return;
        }

        const body = {
            nome,
            email,
            senha,
            telefone,
            categoria,
            endereco
        };

        try {
            const resp = await fetch('/api/prestadores/cadastrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!resp.ok) {
                const erro = await resp.json();
                msg.innerText = erro.message || 'Erro ao cadastrar.';
                msg.style.color = 'red';
                return;
            }

            msg.innerText = 'Cadastro realizado com sucesso!';
            msg.style.color = 'green';
        } catch (e) {
            msg.innerText = 'Erro de conexão com o servidor.';
            msg.style.color = 'red';
        }
    }
</script>
</body>
</html>
