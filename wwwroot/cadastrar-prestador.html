<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RSConnect - Cadastro de Prestador</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark">

<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <h1 class="logo-text">RSConnect</h1>
    </div>

    <h2 class="title">Cadastro de Prestador</h2>

    <input type="text" id="nome" placeholder="Nome completo">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">
    <input type="text" id="categoria" placeholder="Categoria de serviço (ex: Eletricista)">
    <input type="text" id="telefone" placeholder="Telefone">

    <button class="btn-primary" onclick="cadastrarPrestador()">Cadastrar</button>

    <p class="link">
        Já é prestador? <a href="login-prestador.html">Entrar</a>
    </p>

    <p id="erro" class="erro"></p>
</div>

<script src="js/api.js"></script>
<script>
async function cadastrarPrestador() {
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;
    const categoria = document.getElementById("categoria").value;
    const telefone = document.getElementById("telefone").value;

    if (!nome || !email || !senha || !categoria || !telefone) {
        document.getElementById("erro").innerText = "Preencha todos os campos";
        return;
    }

    const data = {
        nome,
        email,
        senha,
        categoria,
        telefone
    };

    try {
        const result = await apiPost("prestadores", data);

        if (result.id) {
            alert("Prestador cadastrado com sucesso!");
            window.location.href = "login-prestador.html";
        } else {
            document.getElementById("erro").innerText = "Erro ao cadastrar prestador";
        }
    } catch {
        document.getElementById("erro").innerText = "Erro ao conectar ao servidor";
    }
}
</script>

</body>
</html>
