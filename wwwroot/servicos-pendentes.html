<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RSConnect - Serviços Pendentes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark">

<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <h1 class="logo-text">RSConnect</h1>
    </div>

    <h2 class="title">Serviços Pendentes</h2>

    <div id="lista"></div>

    <p class="link">
        <a href="login-prestador.html">Sair</a>
    </p>

    <p id="erro" class="erro"></p>
</div>

<script src="js/api.js"></script>
<script>
async function carregarPendentes() {
    const prestadorId = localStorage.getItem("prestadorId");

    if (!prestadorId) {
        window.location.href = "login-prestador.html";
        return;
    }

    const servicos = await apiGet("servicos/pendentes");
    const lista = document.getElementById("lista");

    if (!servicos || servicos.length === 0) {
        lista.innerHTML = "<p style='text-align:center; margin-top:10px;'>Nenhum serviço pendente.</p>";
        return;
    }

    lista.innerHTML = "";

    servicos.forEach(s => {
        lista.innerHTML += `
            <div class="card">
                <h3>${s.categoria}</h3>
                <p>${s.descricao}</p>
                <p><strong>Endereço:</strong> ${s.endereco}</p>
                <p><strong>Data e Hora:</strong> ${s.dataHora}</p>

                <button class="btn-primary" onclick="aceitar(${s.id})">
                    Aceitar serviço
                </button>
            </div>
        `;
    });
}

async function aceitar(id) {
    const prestadorId = localStorage.getItem("prestadorId");

    try {
        const result = await apiPost(`servicos/aceitar/${id}`, { prestadorId });

        if (result.id) {
            alert("Serviço aceito com sucesso!");
            window.location.href = "servicos-aceitos.html";
        } else {
            document.getElementById("erro").innerText = "Erro ao aceitar serviço";
        }
    } catch {
        document.getElementById("erro").innerText = "Erro ao conectar ao servidor";
    }
}

carregarPendentes();
</script>

</body>
</html>
