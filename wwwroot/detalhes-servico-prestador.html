<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RSConnect - Detalhes do Serviço</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark">

<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <h1 class="logo-text">RSConnect</h1>
    </div>

    <h2 class="title">Detalhes do Serviço</h2>

    <div id="detalhes"></div>

    <p class="link">
        <a href="servicos-aceitos.html">Voltar</a>
    </p>

    <p id="erro" class="erro"></p>
</div>

<script src="js/api.js"></script>
<script>
async function carregarDetalhes() {
    const servicoId = localStorage.getItem("servicoId");

    if (!servicoId) {
        document.getElementById("erro").innerText = "Serviço não encontrado.";
        return;
    }

    const servico = await apiGet(`servicos/${servicoId}`);
    const div = document.getElementById("detalhes");

    if (!servico) {
        div.innerHTML = "<p>Erro ao carregar detalhes.</p>";
        return;
    }

    div.innerHTML = `
        <div class="card">
            <h3>${servico.categoria}</h3>
            <p><strong>Descrição:</strong> ${servico.descricao}</p>
            <p><strong>Endereço:</strong> ${servico.endereco}</p>
            <p><strong>Data e Hora:</strong> ${servico.dataHora}</p>
            <p><strong>Status:</strong> ${servico.status}</p>
        </div>
    `;
}

carregarDetalhes();
</script>

</body>
</html>
