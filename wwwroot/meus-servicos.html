<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RSConnect - Meus Serviços</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark">

<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <h1 class="logo-text">RSConnect</h1>
    </div>

    <h2 class="title">Meus Serviços</h2>

    <div id="lista"></div>

    <p class="link">
        <a href="home.html">Voltar</a>
    </p>
</div>

<script src="js/api.js"></script>
<script>
async function carregarServicos() {
    const usuarioId = localStorage.getItem("usuarioId");

    if (!usuarioId) {
        window.location.href = "index.html";
        return;
    }

    const servicos = await apiGet(`servicos/cliente/${usuarioId}`);
    const lista = document.getElementById("lista");

    if (!servicos || servicos.length === 0) {
        lista.innerHTML = "<p style='text-align:center; margin-top:10px;'>Nenhum serviço encontrado.</p>";
        return;
    }

    lista.innerHTML = "";

    servicos.forEach(s => {
        lista.innerHTML += `
            <div class="card">
                <h3>${s.categoria}</h3>
                <p>${s.descricao}</p>
                <p><strong>Status:</strong> ${s.status}</p>
                <button class="btn-primary" onclick="detalhes(${s.id})">Ver detalhes</button>
            </div>
        `;
    });
}

function detalhes(id) {
    localStorage.setItem("servicoId", id);
    window.location.href = "detalhes-servico.html";
}

carregarServicos();
</script>

</body>
</html>
