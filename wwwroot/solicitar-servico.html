<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RSConnect - Solicitar Serviço</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark">

<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <h1 class="logo-text">RSConnect</h1>
    </div>

    <h2 class="title">Solicitar Serviço</h2>

    <input type="text" id="categoria" placeholder="Categoria do serviço">
    <textarea id="descricao" placeholder="Descreva o serviço" rows="4"></textarea>
    <input type="text" id="endereco" placeholder="Endereço">
    <input type="datetime-local" id="dataHora">

    <button class="btn-primary" onclick="criarServico()">Enviar solicitação</button>

    <p class="link">
        <a href="home.html">Voltar</a>
    </p>

    <p id="erro" class="erro"></p>
</div>

<script src="js/api.js"></script>
<script>
async function criarServico() {
    const clienteId = localStorage.getItem("usuarioId");

    const categoria = document.getElementById("categoria").value;
    const descricao = document.getElementById("descricao").value;
    const endereco = document.getElementById("endereco").value;
    const dataHora = document.getElementById("dataHora").value;

    if (!categoria || !descricao || !endereco || !dataHora) {
        document.getElementById("erro").innerText = "Preencha todos os campos";
        return;
    }

    const data = {
        clienteId,
        categoria,
        descricao,
        endereco,
        dataHora,
        status: "Solicitado"
    };

    try {
        const result = await apiPost("servicos", data);

        if (result.id) {
            alert("Serviço solicitado com sucesso!");
            window.location.href = "home.html";
        } else {
            document.getElementById("erro").innerText = "Erro ao solicitar serviço";
        }
    } catch {
        document.getElementById("erro").innerText = "Erro ao conectar ao servidor";
    }
}
</script>

</body>
</html>
