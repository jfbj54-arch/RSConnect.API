<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RSConnect - Login Prestador</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark">

<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <h1 class="logo-text">RSConnect</h1>
    </div>

    <h2 class="title">Login do Prestador</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">

    <button class="btn-primary" onclick="loginPrestador()">Entrar</button>

    <p class="link">
        Não é prestador? <a href="index.html">Voltar</a>
    </p>

    <p class="link">
        É novo aqui? <a href="cadastrar-prestador.html">Cadastrar prestador</a>
    </p>

    <p id="erro" class="erro"></p>
</div>

<script src="js/api.js"></script>
<script>
async function loginPrestador() {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if (!email || !senha) {
        document.getElementById("erro").innerText = "Preencha todos os campos";
        return;
    }

    try {
        const result = await apiPost("prestadores/login", { email, senha });

        if (result.id) {
            localStorage.setItem("prestadorId", result.id);
            window.location.href = "servicos-pendentes.html";
        } else {
            document.getElementById("erro").innerText = "Email ou senha incorretos";
        }
    } catch {
        document.getElementById("erro").innerText = "Erro ao conectar ao servidor";
    }
}
</script>

</body>
</html>
