<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login do Prestador</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        .container { max-width: 400px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 8px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; }
        button { width: 100%; padding: 10px; background: #28a745; color: #fff; border: none; cursor: pointer; }
        .msg { margin-top: 10px; text-align: center; }
        a { display: block; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h2>Login do Prestador</h2>

    <label>Email</label>
    <input type="email" id="email">

    <label>SENHA</label>
    <input type="password" id="senha">

    <button onclick="login()">Entrar</button>

    <a href="cadastrar-prestador.html">Não tenho conta</a>

    <div id="mensagem" class="msg"></div>
</div>

<script>
    async function login() {
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const msg = document.getElementById('mensagem');

        if (!email || !senha) {
            msg.innerText = 'Preencha todos os campos.';
            msg.style.color = 'red';
            return;
        }

        const body = { email, senha };

        try {
            const resp = await fetch('/api/prestadores/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!resp.ok) {
                const erro = await resp.json();
                msg.innerText = erro.message || 'Email ou senha inválidos.';
                msg.style.color = 'red';
                return;
            }

            const prestador = await resp.json();

            // Guardar ID do prestador para usar nas próximas telas
            localStorage.setItem('prestadorId', prestador.id);

            msg.innerText = 'Login realizado com sucesso!';
            msg.style.color = 'green';

            // Redirecionar para a tela de serviços pendentes
            setTimeout(() => {
                window.location.href = 'servicos-pendentes.html';
            }, 1000);

        } catch (e) {
            msg.innerText = 'Erro de conexão com o servidor.';
            msg.style.color = 'red';
        }
    }
</script>
</body>
</html>
