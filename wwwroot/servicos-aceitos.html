<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Serviços Aceitos</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 8px; }
        .servico { border-bottom: 1px solid #ddd; padding: 10px 0; }
        .servico:last-child { border-bottom: none; }
        button { padding: 6px 10px; margin-top: 5px; }
        a { display: block; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h2>Serviços Aceitos</h2>
    <div id="lista"></div>
    <a href="servicos-pendentes.html">Voltar</a>
</div>

<script>
    async function carregarAceitos() {
        const prestadorId = localStorage.getItem('prestadorId');
        const lista = document.getElementById('lista');

        if (!prestadorId) {
            lista.innerHTML = 'Faça login novamente.';
            return;
        }

        lista.innerHTML = 'Carregando...';

        try {
            const resp = await fetch(`/api/servicos/aceitos/${prestadorId}`);

            if (!resp.ok) {
                lista.innerHTML = 'Erro ao carregar serviços.';
                return;
            }

            const dados = await resp.json();

            if (!dados.length) {
                lista.innerHTML = 'Nenhum serviço aceito.';
                return;
            }

            lista.innerHTML = '';

            dados.forEach(s => {
                const div = document.createElement('div');
                div.className = 'servico';
                div.innerHTML = `
                    <strong>Categoria:</strong> ${s.categoria}<br>
                    <strong>Descrição:</strong> ${s.descricao}<br>
                    <strong>Endereço:</strong> ${s.endereco}<br>
                    <strong>Status:</strong> ${s.status}<br>
                    <strong>Data/Hora:</strong> ${new Date(s.dataHora).toLocaleString()}<br>
                    <button onclick="detalhes(${s.id})">Ver Detalhes</button>
                `;
                lista.appendChild(div);
            });
        } catch (e) {
            lista.innerHTML = 'Erro de conexão com o servidor.';
        }
    }

    function detalhes(id) {
        window.location.href = `detalhes-servico-prestador.html?id=${id}`;
    }

    carregarAceitos();
</script>
</body>
</html>
