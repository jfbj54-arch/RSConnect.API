<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RSConnect - Serviços Aceitos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark">

<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">⚡</div>
        <h1 class="logo-text">RSConnect</h1>
    </div>

    <h2 class="title">Serviços Aceitos</h2>

    <div id="lista"></div>

    <p class="link">
        <a href="servicos-pendentes.html">Ver pendentes</a>
    </p>

    <p class="link">
        <a href="login-prestador.html">Sair</a>
    </p>

    <p id="erro" class="erro"></p>
</div>

<script src="js/api.js"></script>
<script>
async function carregarAceitos() {
    const prestadorId = localStorage.getItem("prestadorId");

    if (!prestadorId) {
        window.location.href = "login-prestador.html";
        return;
    }

    const servicos = await apiGet(`servicos/aceitos/${prestadorId}`);
    const lista = document.getElementById("lista");

    if (!servicos || servicos.length === 0) {
        lista.innerHTML = "<p style='text-align:center; margin-top:10px;'>Nenhum serviço aceito.</p>";
        return;
    }

    lista.innerHTML = "";

    servicos.forEach(s => {
        lista.innerHTML += `
            <div class="card">
                <h3>${s.categoria}</h3>
                <p>${s.descricao}</p>
                <p><strong>Endereço:</strong> ${s.endereco}</p>
                <p><strong>Data e Hora:</strong> ${s.dataHora}</p>
                <p><strong>Status:</strong> ${s.status}</p>

                <button class="btn-primary" onclick="detalhes(${s.id})">
                    Ver detalhes
                </button>
            </div>
        `;
    });
}

function detalhes(id) {
    localStorage.setItem("servicoId", id);
    window.location.href = "detalhes-servico-prestador.html";
}

carregarAceitos();
</script>

</body>
</html>
