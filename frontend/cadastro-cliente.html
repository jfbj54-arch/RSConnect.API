<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Cliente | RSConnect</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="app-body">

    <header class="app-header">
        <div class="logo">RSConnect</div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>Criar Conta de Cliente</h2>
            <p class="login-subtext">Preencha os dados abaixo para criar sua conta.</p>

            <form id="cadastroClienteForm">

                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required>

                <label>Email</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>

                <button class="btn primary" type="submit">Criar Conta</button>
            </form>

            <p class="login-footer">
                Já tem conta?
                <a href="login.html">Entrar</a>
            </p>
        </div>
    </main>

    <script src="api.js"></script>

    <script>
        const form = document.getElementById("cadastroClienteForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            const result = await api.cadastrarCliente(nome, email, senha);

            if (result.error) {
                alert("Erro ao cadastrar. Tente outro email.");
                return;
            }

            alert("Conta criada com sucesso!");
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
