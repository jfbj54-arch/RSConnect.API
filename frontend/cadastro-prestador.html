<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Prestador | RSConnect</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="app-body">

    <header class="app-header">
        <div class="logo">RSConnect</div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>Criar Conta de Prestador</h2>
            <p class="login-subtext">Preencha os dados abaixo para começar a receber serviços.</p>

            <form id="cadastroPrestadorForm">

                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required>

                <label>Email</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>

                <label>Categoria</label>
                <select id="categoria" required>
                    <option value="">Selecione...</option>
                    <option>Eletricista</option>
                    <option>Encanador</option>
                    <option>Diarista</option>
                    <option>Pintor</option>
                    <option>Técnico de Informática</option>
                    <option>Pedreiro</option>
                    <option>Jardineiro</option>
                    <option>Manicure</option>
                </select>

                <label>Telefone</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000" required>

                <button class="btn primary" type="submit">Criar Conta</button>
            </form>

            <p class="login-footer">
                Já tem conta?
                <a href="login-prestador.html">Entrar</a>
            </p>
        </div>
    </main>

    <script src="api.js"></script>

    <script>
        const form = document.getElementById("cadastroPrestadorForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const categoria = document.getElementById("categoria").value;
            const telefone = document.getElementById("telefone").value;

            const result = await api.cadastrarPrestador(nome, email, senha, categoria, telefone);

            if (result.error) {
                alert("Erro ao cadastrar. Tente outro email.");
                return;
            }

            alert("Conta criada com sucesso!");
            window.location.href = "login-prestador.html";
        });
    </script>

</body>
</html>
