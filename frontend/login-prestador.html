<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Prestador | RSConnect</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="app-body">

    <header class="app-header">
        <div class="logo">RSConnect</div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>Entrar como Prestador</h2>
            <p class="login-subtext">Acesse sua conta e receba solicitações de serviços.</p>

            <form id="loginPrestadorForm">
                <label>Email</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>

                <button class="btn primary" type="submit">Entrar</button>
            </form>

            <p class="login-footer">
                Não tem conta?
                <a href="#" id="criarContaPrestadorBtn">Criar conta</a>
            </p>
        </div>
    </main>

    <script src="api.js"></script>

    <script>
        const form = document.getElementById("loginPrestadorForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            const result = await api.loginPrestador(email, senha);

            if (result.error) {
                alert(result.error || "Erro ao fazer login");
                return;
            }

            localStorage.setItem("prestador", JSON.stringify(result.prestador));
            window.location.href = "prestador-home.html";
        });

        document.getElementById("criarContaPrestadorBtn").addEventListener("click", () => {
            alert("Cadastro de prestador será criado depois.");
        });
    </script>

</body>
</html>
